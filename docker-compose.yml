networks:
  sitereadiness:
    driver: bridge

services:
  db:
    image: postgis/postgis:16-3.4
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sitereadiness
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: geo
    volumes:
      - ./pipeline/data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sitereadiness

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sitereadiness

  routing:
    image: osrm/osrm-backend:latest
    ports:
      - "5000:5000"
    volumes:
      - ./pipeline/data/osrm:/data
    command: osrm-routed --algorithm mld /data/austin.osrm
    restart: unless-stopped
    networks:
      - sitereadiness
