<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TerraScore // India — Site Readiness &amp; Spatial Analytics</title>
    <style>
      body {
        background: #f8fafc;
      }
    </style>
    <script>
      window.__allErrors = [];
      window.addEventListener('error', function(e) {
        window.__allErrors.push({
          message: e.message,
          filename: e.filename,
          lineno: e.lineno,
          colno: e.colno,
          error: e.error ? (e.error.stack || e.error.message || String(e.error)) : String(e)
        });
        console.error('TRAPPED_ERROR:', e.message, e.error);
      });
      window.addEventListener('unhandledrejection', function(e) {
        window.__allErrors.push({
          type: 'unhandledrejection',
          reason: e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : String(e)
        });
        console.error('TRAPPED_REJECTION:', e.reason);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
